[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dataset-request-desk"
version = "0.1.0"
description = "Backend API for the Dataset Request Desk"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13,<2",
    "bcrypt>=4.0,<4.1",
    "fastapi>=0.115,<1",
    "email-validator>=2,<3",
    "passlib[bcrypt]>=1.7.4,<2",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.6,<3",
    "PyJWT>=2.10,<3",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
