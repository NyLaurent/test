services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: dataset_request_desk
      POSTGRES_USER: dataset
      POSTGRES_PASSWORD: dataset
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dataset -d dataset_request_desk"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://dataset:dataset@db:5432/dataset_request_desk
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-replace-this-with-a-long-random-secret}
      APP_ENV: ${APP_ENV:-development}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      SEED_USERS_FILE: /app/seed/users.json
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "alembic -c backend/alembic.ini upgrade head && python -m app.seed_users && uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"

volumes:
  postgres_data:
